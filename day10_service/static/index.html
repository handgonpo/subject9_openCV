<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Machine Vision Inspection</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

    <main class="container">

        <header>
            <h1>Machine Vision Inspection</h1>
            <p>
                Day10 FastAPI + Multi-Device Service
            </p>
        </header>


        <section class="panel">

            <h2>1. 검사 제품 선택</h2>

            <div class="controls">

                <select id="sampleSelect">
                    <option value="">
                        제품을 선택하세요
                    </option>
                </select>

                <button id="inspectButton">
                    검사하기
                </button>

            </div>

            <div class="preview-box">

                <img
                    id="previewImage"
                    alt="제품 이미지"
                    hidden
                >

            </div>

        </section>


        <section class="panel">

            <h2>2. 검사 결과</h2>

            <div
                id="finalResult"
                class="final waiting"
            >
                WAITING
            </div>

            <div class="result-grid">

                <div>
                    <span>OCR Text</span>
                    <strong id="ocrText">-</strong>
                </div>

                <div>
                    <span>Expected</span>
                    <strong id="expectedText">-</strong>
                </div>

                <div>
                    <span>Reason</span>
                    <strong id="reasonText">-</strong>
                </div>

                <div>
                    <span>Rule Version</span>
                    <strong id="ruleVersion">-</strong>
                </div>

                <div>
                    <span>Service Version</span>
                    <strong id="serviceVersion">-</strong>
                </div>

                <div>
                    <span>Request ID</span>
                    <strong id="requestId">-</strong>
                </div>

            </div>

        </section>


        <section class="panel">

            <h2>3. 오늘 검사 통계</h2>

            <div class="stats">

                <div>
                    <span>Total</span>
                    <strong id="totalCount">0</strong>
                </div>

                <div>
                    <span>OK</span>
                    <strong id="okCount">0</strong>
                </div>

                <div>
                    <span>NG</span>
                    <strong id="ngCount">0</strong>
                </div>

            </div>

        </section>


        <section class="panel">

            <h2>4. 최근 검사</h2>

            <div class="table-wrap">

                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>File</th>
                            <th>Result</th>
                            <th>Reason</th>
                        </tr>
                    </thead>

                    <tbody id="historyBody">
                    </tbody>
                </table>

            </div>

        </section>

    </main>


    <script
        src="/static/app.js"
    ></script>

</body>
</html>
